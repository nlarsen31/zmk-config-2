# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment the following line to enable the Corne OLED Display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_KEYBOARD_NAME="Nick Corne"

# Pointing Device (Trackball) Support
CONFIG_ZMK_POINTING=y

# PMW3610 Driver Configuration (badjeff/zmk-pmw3610-driver)
# Most settings are now in device tree overlay (corne_trackball_left.overlay):
# - cpi setting
# - evt-type, x-input-code, y-input-code
# - irq-gpios configuration
CONFIG_PMW3610_ALT=y
