# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment the following line to enable the Corne OLED Display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_KEYBOARD_NAME="Nick Corne"

# Pointing Device (Trackball) Support
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_DEFAULT_MOVE_VAL=1500
CONFIG_ZMK_POINTING_DEFAULT_SCRL_VAL=20

# PMW3610 Driver Configuration
CONFIG_PMW3610=y
CONFIG_PMW3610_TRIGGER_GLOBAL_THREAD=y
CONFIG_PMW3610_ORIENTATION_0=y
CONFIG_PMW3610_CPI=1600
